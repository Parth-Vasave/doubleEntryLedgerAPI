name: ledger

x-ledger-env: &ledger-env
  DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
  ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
  # Local demo only: lets webhooks target other containers.
  WEBHOOK_ALLOW_PRIVATE_NETWORKS: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: { context: .., args: { CMD: api } }
    environment:
      <<: *ledger-env
      DB_MAX_CONNS: "50"
      # Generous for local load testing; the service default is 500 rps/key.
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-100000}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100000}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: { context: .., args: { CMD: worker } }
    environment:
      <<: *ledger-env
      MIGRATE_ON_START: "false"
      RECONCILE_INTERVAL: 30s
    ports: ["9091:9091"]
    depends_on:
      api: { condition: service_started }

  webhook-sink:
    build: { context: .., args: { CMD: webhook-sink } }

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

volumes:
  pgdata:
