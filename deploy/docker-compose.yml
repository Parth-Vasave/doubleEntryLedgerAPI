name: ledger

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: { context: .., args: { CMD: api } }
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
      LOG_LEVEL: info
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
